name: Update streak stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at 00:00 UTC
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Streak Stats SVG (Dark)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Anurag8500&theme=github-dark&hide_border=true
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats SVG (Light)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Anurag8500&theme=github-light&hide_border=true
          path: profile/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak-dark.svg profile/streak-light.svg
          git commit -m "chore: update github streak stats SVGs [skip ci]" || exit 0
          git push
